# phenotypes.yaml — single source of truth for the phenotype ML pipeline.
#
# Two sections:
#   features:   shared structured feature set (wide-CSV column -> i2b2 ontology).
#               Reused across ALL phenotypes. Each entry maps one column of the
#               cohort wide CSV to one i2b2 concept (path + code + type).
#   phenotypes: per-phenotype label definition + cohort sampling + ML blob.
#
# To add a feature:        add an entry here AND a column in sql/cohort_template.sql.
# To add a phenotype:      add a phenotypes: entry (label ICD predicate + caps),
#                          then `render_cohort_sql.py <phenotype>` and rerun.
#
# Feature `name` MUST equal the wide-CSV column name produced by the cohort SQL.
# Feature `code` is the i2b2 concept_cd: <=50 chars, no / \ , separators.
# Feature `type`: integer | float | assertion  (binary flags -> integer 0/1).

features:
  # ---- demographics ----
  - { name: age,          code: AGE,         path: /MIMIC/features/demographics/age,            type: integer }
  - { name: sex_male,     code: SEX_MALE,    path: /MIMIC/features/demographics/sex_male,        type: integer }

  # ---- comorbidities (binary 0/1, history up to & including index admission) ----
  - { name: cm_htn,       code: CM_HTN,      path: /MIMIC/features/comorbidity/hypertension,      type: integer }
  - { name: cm_dm,        code: CM_DM,       path: /MIMIC/features/comorbidity/diabetes,          type: integer }
  - { name: cm_afib,      code: CM_AFIB,     path: /MIMIC/features/comorbidity/atrial_fibrillation, type: integer }
  - { name: cm_ihd,       code: CM_IHD,      path: /MIMIC/features/comorbidity/ischemic_heart_disease, type: integer }
  - { name: cm_chf,       code: CM_CHF,      path: /MIMIC/features/comorbidity/heart_failure,     type: integer }
  - { name: cm_hld,       code: CM_HLD,      path: /MIMIC/features/comorbidity/hyperlipidemia,    type: integer }
  - { name: cm_ckd,       code: CM_CKD,      path: /MIMIC/features/comorbidity/chronic_kidney_disease, type: integer }
  - { name: cm_pvd,       code: CM_PVD,      path: /MIMIC/features/comorbidity/peripheral_vascular_disease, type: integer }
  - { name: cm_smoke,     code: CM_SMOKE,    path: /MIMIC/features/comorbidity/smoking,           type: integer }
  - { name: cm_carotid,   code: CM_CAROTID,  path: /MIMIC/features/comorbidity/carotid_stenosis,  type: integer }

  # ---- labs (first valuenum during index admission) ----
  - { name: lab_glucose,  code: LAB_GLUCOSE, path: /MIMIC/features/lab/glucose,          type: float }
  - { name: lab_hba1c,    code: LAB_HBA1C,   path: /MIMIC/features/lab/hba1c,            type: float }
  - { name: lab_ldl,      code: LAB_LDL,     path: /MIMIC/features/lab/ldl,              type: float }
  - { name: lab_hdl,      code: LAB_HDL,     path: /MIMIC/features/lab/hdl,              type: float }
  - { name: lab_chol,     code: LAB_CHOL,    path: /MIMIC/features/lab/total_cholesterol, type: float }
  - { name: lab_trig,     code: LAB_TRIG,    path: /MIMIC/features/lab/triglycerides,    type: float }
  - { name: lab_creat,    code: LAB_CREAT,   path: /MIMIC/features/lab/creatinine,       type: float }
  - { name: lab_inr,      code: LAB_INR,     path: /MIMIC/features/lab/inr,              type: float }
  - { name: lab_hgb,      code: LAB_HGB,     path: /MIMIC/features/lab/hemoglobin,       type: float }
  - { name: lab_plt,      code: LAB_PLT,     path: /MIMIC/features/lab/platelets,        type: float }
  - { name: lab_wbc,      code: LAB_WBC,     path: /MIMIC/features/lab/wbc,              type: float }
  - { name: lab_na,       code: LAB_NA,      path: /MIMIC/features/lab/sodium,           type: float }

  # ---- OMR vitals (most recent <= index date) ----
  - { name: vit_sbp,      code: VIT_SBP,     path: /MIMIC/features/vital/systolic_bp,    type: float }
  - { name: vit_dbp,      code: VIT_DBP,     path: /MIMIC/features/vital/diastolic_bp,   type: float }
  - { name: vit_bmi,      code: VIT_BMI,     path: /MIMIC/features/vital/bmi,            type: float }

  # ---- medications (binary 0/1, any order during index admission) ----
  - { name: med_aht,      code: MED_AHT,     path: /MIMIC/features/med/antihypertensive, type: integer }
  - { name: med_statin,   code: MED_STATIN,  path: /MIMIC/features/med/statin,           type: integer }
  - { name: med_ac,       code: MED_AC,      path: /MIMIC/features/med/anticoagulant,    type: integer }
  - { name: med_ap,       code: MED_AP,      path: /MIMIC/features/med/antiplatelet,     type: integer }
  - { name: med_ad,       code: MED_AD,      path: /MIMIC/features/med/antidiabetic,     type: integer }

# Default ML blob shared by all phenotypes unless overridden per-phenotype.
ml_blob_defaults:
  data_paths:        ["/MIMIC/features"]   # subtree the engine pulls features from
  time_buffer:       0                     # days; 0 => cutoff == index_date (v1 snapshot)
  sample_size_limit: 100000                # cap on patients pulled into training
  # random_seed is REQUIRED for reproducibility: the engine reads blob.get('random_seed',
  # 0.42) and uses it for setseed() + SMOTE + the train/test split. Fixing it here makes
  # repeated builds of the same phenotype deterministic (the grant paper's repeatability claim).
  random_seed:       0.42
  # data_period_* bound observation_fact.start_date in the engine's WHERE clause. Set to
  # century boundaries = NO temporal filtering (v1 collapses every fact to index_date anyway).
  # A temporal variant would narrow these to enforce a pre-event feature window.
  data_period_start: "1900-01-01"
  data_period_end:   "2200-12-31"

phenotypes:
  stroke:
    description:   "Ischemic stroke model trained on MIMIC (silver standard ICD-10 I63/I64)"
    label_code:    STROKE
    label_path:    /MIMIC/phenotype/stroke
    ml_concept_code: STROKE_ML
    ml_concept_path: /ML/Diagnosis/Stroke
    # Cases: any admission with one of these ICD prefixes.
    label_icd:
      icd10: [I63, I64]
      icd9:  ["433", "434"]          # 433.x1 / 434.x1 occlusion w/ infarction (incl. unspec)
    # Controls must have NONE of these (avoid contaminating controls with any CVD).
    negative_exclude_icd:
      icd10: [I60, I61, I62, I63, I64, I65, I66, I67, I68, I69, G45, G46]
      icd9:  ["430", "431", "432", "433", "434", "435", "436", "437", "438"]
    cohort:
      max_positives: 800
      neg_per_pos:   2

  heart_failure:
    description:   "Heart-failure model trained on MIMIC (silver standard ICD-10 I50)"
    label_code:    HF
    label_path:    /MIMIC/phenotype/heart_failure
    ml_concept_code: HF_ML
    ml_concept_path: /ML/Diagnosis/HeartFailure
    label_icd:
      icd10: [I50]
      icd9:  ["428"]
    negative_exclude_icd:
      icd10: [I50, I110, I130, I132, I255, I420, I429]
      icd9:  ["428", "4254"]
    cohort:
      max_positives: 800
      neg_per_pos:   2

  ischemic_heart_disease:
    description:   "Ischemic heart disease model trained on MIMIC (silver standard ICD-10 I20-I25)"
    label_code:    IHD
    label_path:    /MIMIC/phenotype/ischemic_heart_disease
    ml_concept_code: IHD_ML
    ml_concept_path: /ML/Diagnosis/IschemicHeartDisease
    label_icd:
      icd10: [I20, I21, I22, I23, I24, I25]
      icd9:  ["410", "411", "412", "413", "414"]
    negative_exclude_icd:
      icd10: [I20, I21, I22, I23, I24, I25]
      icd9:  ["410", "411", "412", "413", "414"]
    cohort:
      max_positives: 800
      neg_per_pos:   2
